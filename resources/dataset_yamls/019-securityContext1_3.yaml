# Ingress Object 
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
  # annotations:
  #   service.beta.kubernetes.io/aws-load-balancer-type: nlb
spec:
  ingressClassName: nginx 
  rules:
  - host: console.b56-roboshop.online
    http:
      paths:
      - path: "/"
        pathType: Prefix
        backend:
          service:
            name: frontend-svc
            port:
              number: 80