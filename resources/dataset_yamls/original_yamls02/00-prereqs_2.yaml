apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nats-operator
rules:
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  verbs:
  - get
  - list
  - create
  - update
  - watch
- apiGroups:
  - nats.io
  resources:
  - natsclusters
  - natsserviceroles
  verbs:
  - '*'
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - create
  - watch
  - get
  - patch
  - update
  - delete
  - list
- apiGroups:
  - ''
  resources:
  - services
  verbs:
  - create
  - watch
  - get
  - patch
  - update
  - delete
  - list
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - create
  - watch
  - get
  - update
  - delete
  - list
- apiGroups:
  - ''
  resources:
  - pods/exec
  - pods/log
  - serviceaccounts/token
  - events
  verbs:
  - '*'
- apiGroups:
  - ''
  resources:
  - namespaces
  - serviceaccounts
  verbs:
  - list
  - get
  - watch
- apiGroups:
  - ''
  resources:
  - endpoints
  verbs:
  - create
  - watch
  - get
  - update
  - delete
  - list
