apiVersion: apps/v1
kind: Deployment
metadata:
  name: confluent-schema-registry
spec:
  template:
    spec:
      containers:
        - name: confluent-schema-registry
          resources:
            requests:
              memory: 256Mi
              cpu: 250m
            limits:
              memory: 512Mi
              cpu: 100m
          securityContext:
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            runAsUser: 10001
  selector: autogenerated-string
  replicas: 2
status:
  readyReplicas: 1
