apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: dify-deploy
spec:
  selector:
    matchLabels:
      app: db
  replicas: 2
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: db
          env:
            - name: PGDATA
              valueFrom:
                configMapKeyRef:
                  name: db-cm
                  key: PGDATA
            - name: PGUSER
              valueFrom:
                configMapKeyRef:
                  name: db-cm
                  key: PGUSER
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: db-cm
                  key: POSTGRES_DB
            - name: POSTGRES_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: db-cm
                  key: PODTGRES_PASSWORD
          image: registry.dev.lingjuninvest.org/dify-deps/postgres:15-alpine
          resources:
            limits:
              cpu: 4
              memory: 4Gi
            requests:
              memory: 512Mi
              cpu: 100m
          livenessProbe:
            exec:
              command:
                - pg_isready
            failureThreshold: 30
            periodSeconds: 1
            timeoutSeconds: 3
          ports:
            - containerPort: 5432
              name: db-port
          volumeMounts:
            - name: db-pvc
              mountPath: /var/lib/postgresql/data
          securityContext:
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            runAsUser: 10001
      volumes:
        - name: db-pvc
          persistentVolumeClaim:
            claimName: db-pvc
