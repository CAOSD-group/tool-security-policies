apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zk-zookeeper
spec:
  template:
    spec:
      containers:
        - name: kubernetes-zookeeper
          resources:
            requests:
              memory: 256Mi
              cpu: 300m
            limits:
              memory: 512Mi
              cpu: 100m
          securityContext:
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            runAsUser: 10001
  selector: autogenerated-string
  serviceName: autogenerated-string
status:
  readyReplicas: 1
