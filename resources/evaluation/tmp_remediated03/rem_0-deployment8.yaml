apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  namespace: secure-namespace
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: myapp
          image: aputra/myapp-178:v1
          ports:
            - containerPort: 8080
          env:
            - name: OTLP_ENDPOINT
              value: tempo.monitoring:4318
          securityContext:
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            runAsUser: 10001
          resources:
            requests:
              memory: 512Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 100m
